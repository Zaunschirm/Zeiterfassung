name: Supabase Keepalive

on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/supabase-keepalive.yml"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Supabase REST API
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://bamufsuengtookhbcnho.supabase.co"
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::GitHub Secret fuer Supabase Key fehlt. Keepalive wird uebersprungen, damit keine Fehler-Mail ausgeloest wird."
            exit 0
          fi

          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo "::error::Supabase URL ist ungueltig: $SUPABASE_URL"
              exit 1
              ;;
          esac

          echo "Supabase Keepalive wird ausgefuehrt."

          curl --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 30 -fsS \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Accept: application/json" \
            "$SUPABASE_URL/rest/v1/projects?select=id&limit=1"

        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
